<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portofolio - Amsal Sahala</title>
    <!-- Menggunakan font modern dari Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #0f172a; /* Warna latar belakang gelap (Dark mode) */
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 450px;
            text-align: center;
        }

        /* Avatar Inisial Teks */
        .profile-initial {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #38bdf8, #0284c7);
            color: #0f172a;
            font-size: 2rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            margin: 0 auto 20px auto;
            box-shadow: 0 4px 14px rgba(56, 189, 248, 0.3);
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 5px;
        }

        p.bio {
            font-size: 0.9rem;
            color: #94a3b8;
            margin-bottom: 25px;
        }

        /* Tombol Link / Kartu */
        .links-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .link-card {
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #1e293b;
            color: #f8fafc;
            text-decoration: none;
            padding: 14px 20px;
            border-radius: 12px;
            font-weight: 500;
            font-size: 0.95rem;
            transition: all 0.2s ease-in-out;
            border: 1px solid #334155;
        }

        .link-card:hover {
            background-color: #334155;
            border-color: #38bdf8;
            transform: translateY(-2px);
        }

        /* Footer */
        footer {
            margin-top: 30px;
            font-size: 0.8rem;
            color: #64748b;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Logo Inisial Nama (AS) -->
        <div class="profile-initial">AS</div>
        
        <h1>Amsal Sahala</h1>
        <p class="bio">Mahasiswa & Tech Enthusiast | Suka Ngoding & Belajar Hal Baru</p>

        <div class="links-list">
            <a href="https://github.com/amsalsahala" target="_blank" class="link-card">
                GitHub Saya
            </a>
            <a href="https://instagram.com/" target="_blank" class="link-card">
                Instagram
            </a>
            <a href="https://wa.me/6281234567890" target="_blank" class="link-card">
                WhatsApp / Kontak
            </a>
            <a href="https://example.com" target="_blank" class="link-card">
                Project Portofolio Lainnya
            </a>
        </div>

        <footer>
            &copy; 2026 - Amsal Sahala
        </footer>
    </div>

</body>
      </html>
